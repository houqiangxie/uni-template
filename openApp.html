<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>打开 App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f2f2f2;
    }
    button {
      padding: 16px 32px;
      font-size: 18px;
      background-color: #07c160;
      color: white;
      border: none;
      border-radius: 8px;
    }
    .dialog-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .dialog {
      background: white;
      padding: 24px;
      width: 80%;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .dialog h3 {
      margin-top: 0;
    }
    .dialog-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-around;
    }
    .dialog-buttons button {
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 6px;
    }
    .cancel {
      background: #ccc;
      color: #333;
    }
    .confirm {
      background: #07c160;
      color: white;
    }
  </style>
</head>
<body>

  <h2>点击下方按钮打开 App</h2>
  <!-- <button onclick="onClickOpen()">继续打开 App</button> -->
   <a href="" target="_blank" class="" id="openApp">打开APP</a>
   <!-- <button class="confirm" onclick="openApp()">继续</button> -->

  <view class="dialog-mask" id="dialog">
    <view class="dialog">
      <h3>即将离开微信</h3>
      <p>将在浏览器中打开 App，是否继续？</p>
      <view class="dialog-buttons">
        <button class="cancel" onclick="hideDialog()">取消</button>
        <button class="confirm" onclick="openApp()">继续</button>
      </view>
    </view>
  </view>

  <script>
    const appScheme = "yourappscheme://path"; // 替换为你的 app scheme
    const fallbackUrl = "https://yourdomain.com/download"; // 替换为 App 未安装时跳转地址
    const params = new URLSearchParams(window.location.search);
        const appUrl = decodeURIComponent(params.get('appUrl'));
        const h5Url = decodeURIComponent(params.get('h5Url'));
        const openAppButton = document.getElementById('openApp');
        openAppButton.href = 'https://wwww.baidu.com';
    function isWeChatBrowser() {
      return /micromessenger/i.test(navigator.userAgent);
    }

    function onClickOpen() {
      if (isWeChatBrowser()) {
        document.getElementById('dialog').style.display = 'flex';
      } else {
        openApp();
      }
    }

    function hideDialog() {
      document.getElementById('dialog').style.display = 'none';
    }

    function openApp() {
        
      hideDialog();

      const startTime = Date.now();
    //   window.location.href = appUrl;
    window.open(h5Url,'_blank');

    //   setTimeout(() => {
    //     const endTime = Date.now();
    //     if (endTime - startTime < 1500) {
    //       window.location.href = h5Url;
    //     }
    //   }, 1200);
    }
  </script>
</body>
</html>
