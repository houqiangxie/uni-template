name: CI

on:
  push:
    branches: [master, main, dev, develop, release, release/**, test]
  pull_request:
    branches: [master, main, dev, develop, release, release/**, test]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ github.base_ref || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Resolve build target
        id: target
        shell: bash
        run: |
          # PR 用目标分支，push 用当前分支
          BRANCH="${{ github.base_ref || github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          case "${BRANCH}" in
            master|main|release|release/*)
              echo "env=production" >> "$GITHUB_OUTPUT"
              echo "h5_script=build:h5" >> "$GITHUB_OUTPUT"
              echo "mp_script=build:mp-weixin" >> "$GITHUB_OUTPUT"
              ;;
            dev|develop|test)
              echo "env=test" >> "$GITHUB_OUTPUT"
              echo "h5_script=build:h5:test" >> "$GITHUB_OUTPUT"
              echo "mp_script=build:mp-weixin:test" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "env=production" >> "$GITHUB_OUTPUT"
              echo "h5_script=build:h5" >> "$GITHUB_OUTPUT"
              echo "mp_script=build:mp-weixin" >> "$GITHUB_OUTPUT"
              ;;
          esac

          if [[ "${BRANCH}" == "master" || "${BRANCH}" == "main" ]]; then
            echo "base_path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            echo "deploy_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "deploy_pages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build H5 (${{ steps.target.outputs.env }})
        run: pnpm run ${{ steps.target.outputs.h5_script }}
        env:
          VITE_BASE_PATH: ${{ steps.target.outputs.base_path }}
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_JS_CODE: ${{ secrets.VITE_AMAP_SECURITY_JS_CODE }}
          VITE_MP_WEIXIN_APPID: ${{ secrets.VITE_MP_WEIXIN_APPID }}
          VITE_AES_KEY: ${{ secrets.VITE_AES_KEY }}
          VITE_RSA_PUBLIC_KEY: ${{ secrets.VITE_RSA_PUBLIC_KEY }}

      - name: Upload H5 artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: h5-${{ steps.target.outputs.env }}-${{ github.sha }}
          path: dist/build/h5
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare GitHub Pages artifact
        if: steps.target.outputs.deploy_pages == 'true' && github.event_name == 'push'
        run: touch dist/build/h5/.nojekyll

      - name: Upload GitHub Pages artifact
        if: steps.target.outputs.deploy_pages == 'true' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/build/h5

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
